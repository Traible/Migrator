name: release

# Started by hand (Actions -> release -> Run workflow, or
# "gh workflow run release.yml --ref main"). Builds the archive of the version
# written in the code, records where it was built from (a signed attestation
# anyone can check with "gh attestation verify") and publishes the release.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        shell: pwsh
        run: |
          Import-Module ./src/lib/Migrator.Core.psm1 -Force
          $version = [string](Get-DefaultConfig).ToolVersion
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Error "Release v$version already exists. Raise the version first."
              exit 1
          }
          exit 0

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      # Runs the smoke tests first; no archive is built when they fail.
      - name: Build
        shell: pwsh
        run: |
          ./build/New-Release.ps1
          ./build/Get-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.version }}' -OutFile dist/notes.md

      - name: Attest the archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Migrator-${{ steps.version.outputs.version }}.zip

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create "v$version" "dist/Migrator-$version.zip" "dist/Migrator-$version.zip.sha256" `
              --target $env:GITHUB_SHA --title "Migrator $version" --notes-file dist/notes.md
